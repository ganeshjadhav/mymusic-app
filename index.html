*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B0C0F;color:#F4F5F7;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{min-height:100dvh;max-width:420px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;justify-content:center;gap:14px}
h1{margin:0;font-size:22px;letter-spacing:-.01em}
p{margin:0;font-size:14px;line-height:1.5;color:#9BA1AD}
input[type=password]{height:52px;border:0;border-radius:4px;background:#1A1D23;color:#F4F5F7;font-size:16px;padding:0 14px;width:100%}
button{height:52px;border:0;border-radius:4px;background:#C8F73A;color:#0B0C0F;font-size:16px;font-weight:800;cursor:pointer}
button[disabled]{opacity:.6}
label{display:flex;align-items:center;gap:10px;font-size:14px;color:#D5D8DF;min-height:44px}
label input{width:20px;height:20px;accent-color:#C8F73A}
#err{min-height:20px;color:#FF7A6B;font-size:14px}
input:focus-visible,button:focus-visible{outline:2px solid #C8F73A;outline-offset:2px}
.rotate{display:none}@media (orientation:landscape) and (max-height:500px){.rotate{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0B0C0F;color:#aaa;font:800 15px system-ui,sans-serif;text-align:center}.rotate b{font-size:34px}}
